name: Apple Silicon desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: arm64
          cache: pip
      - name: Verify native architecture
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Apple Silicon app
        run: python -m PyInstaller --noconfirm --clean adtran_gui.spec
      - name: Check packaged app outside the checkout
        run: python tools/check_macos_build.py
      - name: Package operator test build
        run: python tools/package_desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: ADTRAN-Firmware-Upgrader-macOS-Apple-Silicon
          path: dist/releases/*
          if-no-files-found: error
